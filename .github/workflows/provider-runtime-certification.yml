name: Provider runtime certification

on:
  pull_request:
    paths:
      - "src/fieldora_bastion/provider_runtime.py"
      - "src/fieldora_bastion/atomic_transfer_store.py"
      - "tests/test_provider_runtime.py"
      - "docs/provider-runtime-facade.md"
      - ".github/workflows/provider-runtime-certification.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src/fieldora_bastion/provider_runtime.py src/fieldora_bastion/atomic_transfer_store.py tests/test_provider_runtime.py
      - name: Certify provider runtime facade
        run: pytest -q tests/test_provider_runtime.py tests/test_atomic_transfer_store.py tests/test_transfer_broker.py
