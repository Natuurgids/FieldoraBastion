name: FieldoraBastion secure transfer broker certification

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/fieldora_bastion/transfer_broker.py"
      - "tests/test_transfer_broker.py"
      - "docs/secure-transfer-broker.md"
      - ".github/workflows/transfer-broker-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer-broker-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff broker boundary
        run: python -m ruff check src/fieldora_bastion/transfer_broker.py tests/test_transfer_broker.py
      - name: Test broker lifecycle
        run: python -m pytest -q tests/test_transfer_broker.py
      - name: Certify fail-closed integrity contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/fieldora_bastion/transfer_broker.py').read_text()
          for needle in (
              'COLLECTION = "collection"',
              'DELIVERY = "delivery"',
              'TransferState.QUARANTINED',
              'TransferState.SCANNING',
              'TransferState.VERIFYING',
              'TransferState.COLLECTOR_VERIFYING',
              'TransferState.INTEGRITY_FAILED',
              'manifest_signature != "ed25519"',
              'malware_scan_result != "clean"',
              'package_integrity_mismatch',
              'expected_sha256',
              'observed_sha256',
          ):
              if needle not in text:
                  raise SystemExit(f'missing broker trust contract: {needle}')
          PY
