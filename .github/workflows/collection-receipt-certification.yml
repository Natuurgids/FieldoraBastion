name: Collection receipt certification

on:
  pull_request:
    paths:
      - "src/fieldora_bastion/collection_auth.py"
      - "src/fieldora_bastion/receipt_store.py"
      - "tests/test_collection_auth.py"
      - "tests/test_receipt_store.py"
      - "docs/authenticated-collection-and-receipts.md"
      - ".github/workflows/collection-receipt-certification.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src/fieldora_bastion/collection_auth.py src/fieldora_bastion/receipt_store.py tests/test_collection_auth.py tests/test_receipt_store.py
      - name: Certify authenticated collection and durable receipts
        run: pytest -q tests/test_collection_auth.py tests/test_receipt_store.py tests/test_secure_catalogue.py tests/test_transfer_broker.py
