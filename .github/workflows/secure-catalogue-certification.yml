name: Secure catalogue certification

on:
  pull_request:
    paths:
      - "src/fieldora_bastion/secure_catalogue.py"
      - "src/fieldora_bastion/transfer_broker.py"
      - "tests/test_secure_catalogue.py"
      - "tests/test_transfer_broker.py"
      - "docs/secure-transfer-catalogue.md"
      - ".github/workflows/secure-catalogue-certification.yml"
  push:
    branches: [main]
    paths:
      - "src/fieldora_bastion/secure_catalogue.py"
      - "src/fieldora_bastion/transfer_broker.py"
      - "tests/test_secure_catalogue.py"
      - "tests/test_transfer_broker.py"

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e . pytest
      - name: Certify transfer broker and descriptor catalogue
        run: pytest -q tests/test_transfer_broker.py tests/test_secure_catalogue.py
      - name: Assert catalogue does not carry package bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("src/fieldora_bastion/secure_catalogue.py").read_text()
          assert "package_bytes" not in source
          assert "BroadcastDescriptor" in source
          PY
