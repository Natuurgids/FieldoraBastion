name: Release digest binding certification

on:
  pull_request:
    paths:
      - "src/fieldora_bastion/provider_runtime.py"
      - "src/fieldora_bastion/release_binding.py"
      - "tests/test_release_digest_binding.py"
      - "docs/release-digest-transfer-binding.md"
      - ".github/workflows/release-digest-binding-certification.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src/fieldora_bastion/provider_runtime.py src/fieldora_bastion/release_binding.py tests/test_release_digest_binding.py
      - name: Certify release digest binding
        run: pytest -q tests/test_release_digest_binding.py tests/test_provider_runtime.py tests/test_atomic_transfer_store.py tests/test_transfer_broker.py
