name: Standalone Security Install transfer certification

on:
  push:
    paths:
      - "src/fieldora_bastion/security_install_transfer.py"
      - "src/fieldora_bastion/cli.py"
      - "tests/test_security_install_transfer.py"
      - ".github/workflows/security-install-transfer-certification.yml"
  pull_request:
    paths:
      - "src/fieldora_bastion/security_install_transfer.py"
      - "src/fieldora_bastion/cli.py"
      - "tests/test_security_install_transfer.py"
      - ".github/workflows/security-install-transfer-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-security-install-transfer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src/fieldora_bastion/security_install_transfer.py src/fieldora_bastion/cli.py tests/test_security_install_transfer.py
      - run: python -m pytest -q tests/test_security_install_transfer.py
      - name: Certify standalone boundary
        run: |
          fieldora-bastion export-security-install --help >/dev/null
          ! grep -Ei 'postgres|fieldora-access-dsn|fieldora.*ca' src/fieldora_bastion/security_install_transfer.py
          ! grep -E '"transfer_receipt"|"independent_verification"' src/fieldora_bastion/security_install_transfer.py
