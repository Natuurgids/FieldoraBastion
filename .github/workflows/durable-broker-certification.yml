name: Durable broker certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fieldora_bastion/durable_broker.py"
      - "tests/test_durable_broker.py"
      - "docs/durable-broker-state.md"
      - ".github/workflows/durable-broker-certification.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src/fieldora_bastion/durable_broker.py tests/test_durable_broker.py
      - name: Certify durable broker recovery
        run: pytest -q tests/test_transfer_broker.py tests/test_durable_broker.py
