name: FieldoraBastion Wazuh security monitoring certification

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/fieldora_bastion/security_monitoring.py"
      - "tests/test_security_monitoring.py"
      - "docs/wazuh-security-monitoring.md"
      - ".github/workflows/wazuh-security-monitoring-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wazuh-security-monitoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff Wazuh integration
        run: python -m ruff check src/fieldora_bastion/security_monitoring.py tests/test_security_monitoring.py
      - name: Wazuh sink tests
        run: python -m pytest -q tests/test_security_monitoring.py tests/test_transfer_broker.py
      - name: Certify trust boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("src/fieldora_bastion/security_monitoring.py").read_text()
          docs = Path("docs/wazuh-security-monitoring.md").read_text()
          for required in ("WazuhJsonlSink", "SecurityAlert", "json.dumps", "os.fsync"):
              if required not in source:
                  raise SystemExit(f"missing Wazuh sink contract: {required}")
          for required in ("<log_format>json</log_format>", "cannot mark a package clean", "fail-closed", "signing keys"):
              if required not in docs:
                  raise SystemExit(f"missing Bastion/Wazuh trust boundary: {required}")
          PY
