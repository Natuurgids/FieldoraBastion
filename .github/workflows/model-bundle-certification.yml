name: FieldoraBastion model bundle certification

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "Containerfile"
      - "compose.yaml"
      - "src/fieldora_bastion/**"
      - "tests/test_model_bundle.py"
      - ".github/workflows/model-bundle-certification.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "Containerfile"
      - "compose.yaml"
      - "src/fieldora_bastion/**"
      - "tests/test_model_bundle.py"
      - ".github/workflows/model-bundle-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-bundle-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src/fieldora_bastion tests/test_model_bundle.py
      - name: Bundle builder security signing and scan-attestation tests
        run: python -m pytest -q tests/test_model_bundle.py
      - name: CLI contract
        run: |
          fieldora-bastion --help >/dev/null
          fieldora-bastion build-model-bundle --help >/dev/null
          fieldora-bastion build-model-bundle --help | grep -- '--signing-key' >/dev/null
          fieldora-bastion build-model-bundle --help | grep -- '--scan-report' >/dev/null
      - name: Certify Fieldora model signature and scan boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          from fieldora_bastion import model_bundle as m
          if m._MODEL_EXTENSIONS != {'.safetensors', '.onnx', '.gguf'}:
              raise SystemExit(f'unexpected model allowlist: {sorted(m._MODEL_EXTENSIONS)}')
          required_forbidden = {'.py', '.pkl', '.pickle', '.pt', '.pth', '.bin', '.sh', '.ps1', '.exe'}
          if not required_forbidden <= m._FORBIDDEN_EXTENSIONS:
              raise SystemExit('executable/pickle rejection boundary is incomplete')
          if m._MAX_FILES > 10000 or m._MAX_SCAN_REPORT_BYTES > 64 * 1024:
              raise SystemExit('bundle or scan-attestation bounds are unexpectedly broad')
          text = Path('src/fieldora_bastion/model_bundle.py').read_text()
          for required in (
              'Ed25519PrivateKey', 'manifest.sig', 'algorithm": "ed25519"', 'key_id',
              'malware_scan', 'scan report must attest a clean result',
              'scan report file_count does not match bundle payload',
              'scan attestation requires a signing key',
          ):
              if required not in text:
                  raise SystemExit(f'missing Bastion trust-boundary marker: {required}')
          PY
      - name: Certify isolated container contract
        run: |
          python - <<'PY'
          from pathlib import Path
          compose = Path('compose.yaml').read_text()
          required = (
              'network_mode: none',
              'read_only: true',
              'user: "10001:10001"',
              'cap_drop:',
              '- ALL',
              'no-new-privileges:true',
              './quarantine:/quarantine:ro',
              './approved:/approved:rw',
          )
          for needle in required:
              if needle not in compose:
                  raise SystemExit(f'missing container isolation marker: {needle}')
          forbidden = ('docker.sock', 'FIELDORA_', '/var/lib/fieldora', 'network_mode: host')
          for needle in forbidden:
              if needle in compose:
                  raise SystemExit(f'forbidden trust-boundary marker: {needle}')
          containerfile = Path('Containerfile').read_text()
          if 'USER 10001:10001' not in containerfile:
              raise SystemExit('runtime image must drop root')
          PY
