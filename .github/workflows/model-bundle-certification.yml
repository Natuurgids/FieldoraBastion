name: FieldoraBastion model bundle certification

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "src/fieldora_bastion/**"
      - "tests/test_model_bundle.py"
      - ".github/workflows/model-bundle-certification.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/fieldora_bastion/**"
      - "tests/test_model_bundle.py"
      - ".github/workflows/model-bundle-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-bundle-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src/fieldora_bastion tests/test_model_bundle.py
      - name: Bundle builder security tests
        run: python -m pytest -q tests/test_model_bundle.py
      - name: CLI contract
        run: |
          fieldora-bastion --help >/dev/null
          fieldora-bastion build-model-bundle --help >/dev/null
      - name: Certify Fieldora model format boundary
        run: |
          python - <<'PY'
          from fieldora_bastion import model_bundle as m
          if m._MODEL_EXTENSIONS != {'.safetensors', '.onnx', '.gguf'}:
              raise SystemExit(f'unexpected model allowlist: {sorted(m._MODEL_EXTENSIONS)}')
          required_forbidden = {'.py', '.pkl', '.pickle', '.pt', '.pth', '.bin', '.sh', '.ps1', '.exe'}
          if not required_forbidden <= m._FORBIDDEN_EXTENSIONS:
              raise SystemExit('executable/pickle rejection boundary is incomplete')
          if m._MAX_FILES > 10000:
              raise SystemExit('file-count bound is unexpectedly broad')
          PY
