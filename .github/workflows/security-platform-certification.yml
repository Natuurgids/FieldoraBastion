name: FieldoraBastion security provider certification

on:
  pull_request:
    paths:
      - "src/fieldora_bastion/platform_contract.py"
      - "src/fieldora_bastion/security_monitoring.py"
      - "tests/test_platform_contract.py"
      - "tests/test_security_monitoring.py"
      - "docs/security-platform.md"
      - ".github/workflows/security-platform-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff provider contract
        run: python -m ruff check src/fieldora_bastion/platform_contract.py src/fieldora_bastion/security_monitoring.py tests/test_platform_contract.py tests/test_security_monitoring.py
      - name: Provider contract tests
        run: python -m pytest -q tests/test_platform_contract.py tests/test_transfer_broker.py tests/test_security_monitoring.py
      - name: Certify provider boundaries
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("src/fieldora_bastion/platform_contract.py").read_text()
          monitoring = Path("src/fieldora_bastion/security_monitoring.py").read_text()
          docs = Path("docs/security-platform.md").read_text()

          for required in (
              'capability="secure-transfer"',
              'provider_id="fieldora-bastion"',
              "protocol_version=1",
          ):
              if required not in source:
                  raise SystemExit(f"missing Bastion provider contract: {required}")

          if '"fieldora"' in monitoring:
              raise SystemExit("generic Bastion monitoring envelope must not be Fieldora-namespaced")

          for boundary in (
              "It is not the umbrella security platform",
              "These names are defaults, not architectural requirements",
              "compatible alternative may replace any provider",
              "FieldoraBastion implements the `secure-transfer` provider slot",
              "FieldoraBastion does not own Keycloak, Wazuh, OpenKAT, Renovate, Trivy, Syft, OSV",
              "must not collapse all security functions into one privileged container",
              "commercial-private",
          ):
              if boundary not in docs:
                  raise SystemExit(f"missing provider boundary: {boundary}")
          PY
