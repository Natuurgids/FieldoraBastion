name: FieldoraBastion security platform certification

on:
  pull_request:
    paths:
      - "src/fieldora_bastion/platform_contract.py"
      - "src/fieldora_bastion/security_monitoring.py"
      - "tests/test_platform_contract.py"
      - "tests/test_security_monitoring.py"
      - "docs/security-platform.md"
      - ".github/workflows/security-platform-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff platform contract
        run: python -m ruff check src/fieldora_bastion/platform_contract.py src/fieldora_bastion/security_monitoring.py tests/test_platform_contract.py tests/test_security_monitoring.py
      - name: Platform contract tests
        run: python -m pytest -q tests/test_platform_contract.py tests/test_transfer_broker.py tests/test_security_monitoring.py
      - name: Certify reusable security boundaries
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("src/fieldora_bastion/platform_contract.py").read_text()
          monitoring = Path("src/fieldora_bastion/security_monitoring.py").read_text()
          docs = Path("docs/security-platform.md").read_text()
          for capability in (
              "secure-transfer",
              "identity-broker",
              "security-monitoring",
              "security-posture",
              "software-supply-chain",
          ):
              if capability not in source:
                  raise SystemExit(f"missing capability: {capability}")
          for tool in ("renovate", "trivy", "syft", "osv"):
              if tool not in source:
                  raise SystemExit(f"missing supply-chain control: {tool}")
          if '"fieldora"' in monitoring:
              raise SystemExit("generic Bastion monitoring envelope must not be Fieldora-namespaced")
          for boundary in (
              "Fieldora remains the first product adapter",
              "must not be collapsed into one privileged container",
              "Fieldora remains authoritative for PBAC",
              "commercial-private",
              "must not create an obligation to publish unrelated proprietary consumer-product source",
          ):
              if boundary not in docs:
                  raise SystemExit(f"missing security boundary: {boundary}")
          PY
