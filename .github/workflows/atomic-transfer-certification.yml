name: Atomic transfer certification

on:
  pull_request:
    paths:
      - "src/fieldora_bastion/atomic_transfer_store.py"
      - "tests/test_atomic_transfer_store.py"
      - "docs/atomic-transfer-store.md"
      - ".github/workflows/atomic-transfer-certification.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src/fieldora_bastion/atomic_transfer_store.py tests/test_atomic_transfer_store.py
      - name: Certify atomic transfer metadata
        run: pytest -q tests/test_atomic_transfer_store.py
