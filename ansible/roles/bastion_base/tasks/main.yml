---
- name: Create Bastion service group
  ansible.builtin.group:
    name: "{{ bastion_base_group }}"
    system: true

- name: Create Bastion service account
  ansible.builtin.user:
    name: "{{ bastion_base_user }}"
    group: "{{ bastion_base_group }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Create Bastion data boundaries
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ bastion_base_user }}"
    group: "{{ bastion_base_group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ bastion_base_root }}", mode: "0750" }
    - { path: "{{ bastion_base_quarantine }}", mode: "0700" }
    - { path: "{{ bastion_base_export }}", mode: "0750" }
    - { path: "{{ bastion_base_runtime }}", mode: "0700" }

- name: Create root-owned Bastion secret directory
  ansible.builtin.file:
    path: "{{ bastion_base_secrets }}"
    state: directory
    owner: root
    group: "{{ bastion_base_group }}"
    mode: "0750"

- name: Install malware scanner
  ansible.builtin.package:
    name: clamav
    state: present

- name: Refuse deployment of signing secrets through Ansible variables
  ansible.builtin.assert:
    that:
      - bastion_signing_private_key is not defined
      - fieldora_database_password is not defined
      - fieldora_pbac_secret is not defined
      - fieldora_internal_ca_private_key is not defined
    fail_msg: >-
      Bastion deployment must not receive private signing material or Fieldora
      trust-domain secrets through inventory or playbook variables.

- name: Validate external secret-handler configuration
  ansible.builtin.assert:
    that:
      - bastion_base_secret_handler in ["vault", "hsm", "tpm"]
      - bastion_base_secret_handler_endpoint | length > 0
    fail_msg: >-
      Configure a Bastion-local Vault/HSM/TPM secret handler. Private signing
      material must not be distributed through Ansible.

- name: Refuse regular-file signing keys
  ansible.builtin.stat:
    path: "{{ bastion_base_secrets }}/acquisition-signing-key.pem"
  register: bastion_base_legacy_signing_key

- name: Fail if a file-based signing key is present
  ansible.builtin.assert:
    that:
      - not bastion_base_legacy_signing_key.stat.exists
    fail_msg: >-
      Remove the file-based Bastion signing key. Signing authority must be
      exposed by the configured Vault/HSM/TPM handler.

- name: Install Bastion systemd unit
  ansible.builtin.template:
    src: fieldora-bastion.service.j2
    dest: /etc/systemd/system/fieldora-bastion.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable Bastion service
  ansible.builtin.systemd_service:
    name: fieldora-bastion.service
    enabled: true
    daemon_reload: true

- name: Validate Bastion-local Keycloak settings when enabled
  ansible.builtin.assert:
    that:
      - bastion_base_keycloak_issuer | length > 0
      - bastion_base_keycloak_audience | length > 0
      - "'fieldora' not in bastion_base_keycloak_issuer | lower"
    fail_msg: >-
      Bastion OIDC must use an explicitly configured Bastion-local issuer and
      audience, not a Fieldora identity endpoint.
  when: bastion_base_keycloak_enabled | bool

- name: Install non-secret Bastion runtime environment
  ansible.builtin.template:
    src: fieldora-bastion.env.j2
    dest: /etc/fieldora-bastion/runtime.env
    owner: root
    group: "{{ bastion_base_group }}"
    mode: "0640"
