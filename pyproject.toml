[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "fieldora-bastion"
version = "0.1.0"
description = "Optional acquisition and quarantine boundary for Fieldora"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.7,<1"]

[project.scripts]
fieldora-bastion = "fieldora_bastion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldora_bastion"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
